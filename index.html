<script>
  function playNotificationSound() {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
    oscillator.frequency.setValueAtTime(1200, audioContext.currentTime + 0.15);

    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(
        0.01,
        audioContext.currentTime + 0.5
    );

    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.5);
  }
  let completedMilestones = new Set();
let notificationCount = 0;
let notifications = [];
let popupTimeout = null;

function resetMilestoneNotifications() {
    completedMilestones.clear();
}

function showMilestonePopup(icon, title, message) {

    playNotificationSound();

    document.getElementById("popupIcon").textContent = icon;
    document.getElementById("popupTitle").textContent = title;
    document.getElementById("popupMessage").textContent = message;

    document.getElementById("milestonePopup").classList.add("show");

    clearTimeout(popupTimeout);

    popupTimeout = setTimeout(() => {
        closeMilestonePopup();
    }, 5000);
  }

function closeMilestonePopup() {
    document.getElementById("milestonePopup").classList.remove("show");
}

function addNotification(icon, title, message) {

    notifications.unshift({
        icon: icon,
        title: title,
        message: message,
        time: new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        })
    });

    notificationCount++;

    updateNotificationUI();
}

function updateNotificationUI() {

    const badge = document.getElementById("notificationBadge");
    const list = document.getElementById("notificationList");

    if (notificationCount > 0) {
        badge.style.display = "flex";
        badge.textContent = notificationCount;
    } else {
        badge.style.display = "none";
    }

    if (notifications.length === 0) {
        list.innerHTML =
            '<p class="no-notifications">No notifications yet.</p>';
        return;
    }

    list.innerHTML = notifications.map(n => `
        <div class="notification-item">
            <strong>${n.icon} ${n.title}</strong>
            <div>${n.message}</div>
            <div class="notification-time">${n.time}</div>
        </div>
    `).join("");
}

function toggleNotifications() {

    const panel = document.getElementById("notificationPanel");

    if (panel.style.display === "block") {
        panel.style.display = "none";
    } else {
        panel.style.display = "block";

        // Mark notifications as read
        notificationCount = 0;
        updateNotificationUI();
    }
}

function clearNotifications() {

    notifications = [];
    notificationCount = 0;

    updateNotificationUI();
  }

const CORRECT_USERNAME = "student";
const CORRECT_PASSWORD = "Study@123";

let failedAttempts = 0;
let lockUntil = 0;

let sessionActive = false;
let sessionTimer = null;




/* =====================================================
   TIMER SETTINGS
===================================================== */

let totalSeconds = 25 * 60;
let remainingSeconds = totalSeconds;

let timerInterval = null;
let isRunning = false;

let sessionsCompleted = 0;
let totalStudyMinutes = 0;


/* =====================================================
   PRO SETTINGS
===================================================== */

let proUnlocked =
    localStorage.getItem("pro") === "yes";

const validCodes = [
    "X7P9K2",

];

/* =====================================================
   TIMER SOUNDS
===================================================== */

let audioContext = null;

function getAudioContext() {

    if (!audioContext) {
        audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    return audioContext;
}

function playBeep(
    frequency = 800,
    duration = 0.15,
    volume = 0.15
) {

    const ctx = getAudioContext();

    const oscillator = ctx.createOscillator();
    const gainNode = ctx.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = frequency;

    gainNode.gain.setValueAtTime(
        volume,
        ctx.currentTime
    );

    gainNode.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + duration
    );

    oscillator.connect(gainNode);
    gainNode.connect(ctx.destination);

    oscillator.start();

    oscillator.stop(
        ctx.currentTime + duration
    );
}

function playStartSound() {
    playBeep(700, 0.18, 0.18);
}

function playTickSound() {
    playBeep(1000, 0.08, 0.12);
}

function playEndSound() {

    playBeep(900, 0.20, 0.20);

    setTimeout(function() {
        playBeep(1200, 0.20, 0.20);
    }, 250);

    setTimeout(function() {
        playBeep(1500, 0.35, 0.20);
    }, 500);
  }

/* =====================================================
   PAGE LOAD
===================================================== */

window.onload = function() {

    /*
       Always start with login screen.
       We do NOT save login session in localStorage.
    */

    sessionActive = false;

    document.getElementById("loginBox").style.display = "block";
    document.getElementById("appInterface").style.display = "none";

    updateDisplay();
    updateProStatus();

};


/* =====================================================
   LOGIN
===================================================== */

function login() {

    const now = Date.now();

    /* Check temporary lock */

    if (now < lockUntil) {

        const remaining =
            Math.ceil((lockUntil - now) / 1000);

        document.getElementById("loginMessage").textContent =
            "🔒 Too many failed attempts. Try again in " +
            remaining +
            " seconds.";

        document.getElementById("loginMessage").style.color = "red";

        return;
    }


    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;


    /* Check credentials */

    if (
        username === CORRECT_USERNAME &&
        password === CORRECT_PASSWORD
    ) {

        failedAttempts = 0;

        startSession();

        document.getElementById("loginMessage").textContent =
            "✅ Login successful!";

        document.getElementById("loginMessage").style.color =
            "green";

        return;
    }


    /* Wrong login */

    failedAttempts++;

    document.getElementById("loginMessage").style.color =
        "red";


    if (failedAttempts >= 5) {

        lockUntil = Date.now() + 30000;

        failedAttempts = 0;

        document.getElementById("loginMessage").textContent =
            "🔒 Too many failed attempts. Login locked for 30 seconds.";

    } else {

        document.getElementById("loginMessage").textContent =
            "❌ Incorrect username or password. Attempts left: " +
            (5 - failedAttempts);

    }

}


/* =====================================================
   START SESSION
===================================================== */

function startSession() {

    sessionActive = true;

    /* Hide login */

    document.getElementById("loginBox").style.display =
        "none";

    /* Show complete application */

    document.getElementById("appInterface").style.display =
        "block";

    /* Reset login fields */

    document.getElementById("username").value = "";
    document.getElementById("password").value = "";

    /* Start inactivity timer */

    resetSessionTimer();

}


/* =====================================================
   SESSION TIMEOUT
===================================================== */

function resetSessionTimer() {

    if (!sessionActive) {
        return;
    }

    clearTimeout(sessionTimer);

    /*
       Session expiry = selected timer duration + 5 minutes

       10 min  → 15 min
       25 min  → 30 min
       50 min  → 55 min
       90 min  → 95 min
    */

    const sessionTimeout =
        (totalSeconds + (5 * 60)) * 1000;

    sessionTimer = setTimeout(
        expireSession,
        sessionTimeout
    );

  }


/* =====================================================
   EXPIRE SESSION
===================================================== */

function expireSession() {

    sessionActive = false;

    clearTimeout(sessionTimer);

    /* Stop timer */

    if (timerInterval !== null) {

        clearInterval(timerInterval);

        timerInterval = null;

    }

    isRunning = false;

    /* Stop rain sound */

    stopRainWithoutLoginCheck();


    /* Hide application */

    document.getElementById("appInterface").style.display =
        "none";

    /* Show login */

    document.getElementById("loginBox").style.display =
        "block";


    /* Clear credentials */

    document.getElementById("username").value = "";
    document.getElementById("password").value = "";


    /* Show message */

    document.getElementById("loginMessage").textContent =
        "🔒 Session expired due to inactivity. Please login again.";

    document.getElementById("loginMessage").style.color =
        "orange";

}

/* =====================================================
   LOGIN PROTECTION
===================================================== */

function requireLogin() {

    if (!sessionActive) {

        alert("🔒 Please login first.");

        return false;
    }

    return true;

}


/* =====================================================
   TIMER DISPLAY
===================================================== */

function updateDisplay() {

    let minutes =
        Math.floor(remainingSeconds / 60);

    let seconds =
        remainingSeconds % 60;

    minutes =
        String(minutes).padStart(2, "0");

    seconds =
        String(seconds).padStart(2, "0");

    document.getElementById("timer").textContent =
        minutes + ":" + seconds;

    updateProgress();
  }

/* =====================================================
   START TIMER
===================================================== */
function start() {

    if (!requireLogin()) {
        return;
    }

    if (isRunning) {
        return;
    }

    playStartSound();

    isRunning = true;

    timerInterval = setInterval(function() {

        if (remainingSeconds > 0) {

            remainingSeconds--;

            updateDisplay();

            /* Tick during last 10 seconds */

            if (
                remainingSeconds > 0 &&
                remainingSeconds <= 10
            ) {
                playTickSound();
            }

        } else {

            clearInterval(timerInterval);

            timerInterval = null;

            isRunning = false;

            playEndSound();

            sessionsCompleted++;

            totalStudyMinutes +=
                Math.floor(totalSeconds / 60);

            updateStats();

            alert("🎉 Study session completed!");

        }

    }, 1000);

  }

  


/* =====================================================
   PAUSE TIMER
===================================================== */

function pause() {

    if (!requireLogin()) {
        return;
    }

    if (timerInterval !== null) {

        clearInterval(timerInterval);

        timerInterval = null;

    }

    isRunning = false;

}


/* =====================================================
   RESET TIMER
===================================================== */

function reset() {

    if (!requireLogin()) {
        return;
    }

    if (timerInterval !== null) {

        clearInterval(timerInterval);

        timerInterval = null;

    }

    isRunning = false;

    remainingSeconds = totalSeconds;

    updateDisplay();

}


/* =====================================================
   SET TIME
===================================================== */

function setTime(minutes) {

    if (!requireLogin()) {
        return;
    }

    if (timerInterval !== null) {

        clearInterval(timerInterval);

        timerInterval = null;
    }

    isRunning = false;

    totalSeconds = minutes * 60;

    remainingSeconds = totalSeconds;

    updateDisplay();

  }

  
  /* =====================================================
   UPDATE PROGRESS BAR
===================================================== */
function updateProgress() {

    const progressFill = document.getElementById("progressFill");
    const progressPercent = document.getElementById("progressPercent");

    if (!progressFill || !progressPercent) return;

    if (totalSeconds <= 0) {
        progressFill.style.width = "0%";
        progressPercent.textContent = "0%";
        return;
    }

    const elapsedSeconds = totalSeconds - remainingSeconds;

    let percentage = (elapsedSeconds / totalSeconds) * 100;

    if (percentage < 0) percentage = 0;
    if (percentage > 100) percentage = 100;

    percentage = Math.round(percentage);

    progressFill.style.width = percentage + "%";
    progressPercent.textContent = percentage + "%";

    // Check milestone notifications
    checkProgressMilestones();
  }


/* =====================================================
   PRO 90 MINUTE TIMER
===================================================== */

function pro90() {

    if (!requireLogin()) {
        return;
    }

    if (!proUnlocked) {

        alert(
            "🔒 Pro feature locked.\n\n" +
            "Please unlock Pro using a valid Pro code."
        );

        return;
    }

    setTime(90);

}


/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats() {

    document.getElementById("sessions").textContent =
        sessionsCompleted;

    document.getElementById("studyMinutes").textContent =
        totalStudyMinutes;

}


/* =====================================================
   RAIN SOUND
===================================================== */

function playRain() {

    if (!requireLogin()) {
        return;
    }

    const audio =
        document.getElementById("rainAudio");

    audio.play().catch(function(error) {

        console.log(
            "Audio playback error:",
            error
        );

    });

}


function stopRain() {

    if (!requireLogin()) {
        return;
    }

    stopRainWithoutLoginCheck();

}


function stopRainWithoutLoginCheck() {

    const audio =
        document.getElementById("rainAudio");

    audio.pause();

    audio.currentTime = 0;

}


/* =====================================================
   PRO UNLOCK
===================================================== */

function unlockPro() {

    if (!requireLogin()) {
        return;
    }

    const code =
        document.getElementById("proCode")
        .value
        .trim()
        .toUpperCase();


    if (validCodes.includes(code)) {

        proUnlocked = true;

        localStorage.setItem(
            "pro",
            "yes"
        );

        document.getElementById("proMessage").textContent =
            "✅ Pro unlocked successfully!";

        document.getElementById("proMessage").style.color =
            "green";

        updateProStatus();

    } else {

        document.getElementById("proMessage").textContent =
            "❌ Invalid Pro code.";

        document.getElementById("proMessage").style.color =
            "red";

    }

}


/* =====================================================
   PRO STATUS
===================================================== */

/* =====================================================
   PRO STATUS
===================================================== */

function updateProStatus() {

    if (proUnlocked) {

        document.getElementById("proStatus").textContent =
            "⭐ Pro Unlocked";

        document.getElementById("proStatus").style.color =
            "green";

    } else {

        document.getElementById("proStatus").textContent =
            "🔓 Standard Mode";

        document.getElementById("proStatus").style.color =
            "#333";
    }
}


/* =====================================================
   LOGOUT
===================================================== */

function logoutUser() {

    // Stop timer
    if (timerInterval !== null) {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    isRunning = false;

    // Stop rain sound
    if (typeof stopRainWithoutLoginCheck === "function") {
        stopRainWithoutLoginCheck();
    }

    // Cancel session expiry
    clearTimeout(sessionTimer);

    // End session
    sessionActive = false;

    // Hide app
    document.getElementById("appInterface").style.display =
        "none";

    // Show login screen
    document.getElementById("loginBox").style.display =
        "block";

    // Clear login fields
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";

    // Clear login message
    document.getElementById("loginMessage").textContent = "";

    // Reset timer to 25 minutes
    totalSeconds = 25 * 60;
    remainingSeconds = totalSeconds;

    // Reset progress milestones
    resetMilestoneNotifications();

    updateDisplay();
}

</script>
